name: Release

# Builds a signed release APK. This only runs when release signing secrets are
# configured on the repository - no signing material is ever committed.
#
# Required repository secrets:
#   GROCERY_PRICER_KEYSTORE_BASE64  - base64 of your release keystore
#   GROCERY_PRICER_KEYSTORE_PASSWORD
#   GROCERY_PRICER_KEY_ALIAS
#   GROCERY_PRICER_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.GROCERY_PRICER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured; skipping the signed release build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Write the keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.GROCERY_PRICER_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > release.keystore

      - name: Build the signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          GROCERY_PRICER_KEYSTORE_PATH: release.keystore
          GROCERY_PRICER_KEYSTORE_PASSWORD: ${{ secrets.GROCERY_PRICER_KEYSTORE_PASSWORD }}
          GROCERY_PRICER_KEY_ALIAS: ${{ secrets.GROCERY_PRICER_KEY_ALIAS }}
          GROCERY_PRICER_KEY_PASSWORD: ${{ secrets.GROCERY_PRICER_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload the release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Grocery-Pricer-Android-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove the keystore
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f release.keystore
