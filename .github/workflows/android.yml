name: Android

# Builds and tests Grocery Pricer and publishes an installable debug APK as a
# downloadable artifact on every run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: Run Android Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # Gradle buries compiler errors under a long stack trace. Repeat just the
      # errors at the end of the log so a failure is readable at a glance.
      - name: Summarise build errors
        if: failure()
        run: |
          echo "### Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            grep -E "^e: |^ERROR:|error: " "$RUNNER_TEMP/gradle.log" || true
            grep -E "^\* What went wrong:" -A 6 "$RUNNER_TEMP/gradle.log" || true
          } | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -200 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # A Room migration is the one piece of this app no unit test can exercise without the
      # Android SDK, and getting it wrong crashes on launch for anyone who already had data.
      # Room exports what it expects at build time, so the migration is checked against that
      # rather than against anybody's memory of Room's CREATE TABLE formatting.
      # A failing test is not a compile error, so the grep above never showed one - the log
      # just said "There were failing tests" and the names were buried thousands of lines up.
      - name: Summarise failing tests
        if: failure()
        run: |
          {
            echo "### Failing tests"
            echo ""
            echo '```'
            python3 - <<'PYEOF'
          import glob
          import xml.etree.ElementTree as ET

          found = False
          for path in sorted(glob.glob("*/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      found = True
                      print("{} > {}".format(case.get("classname"), case.get("name")))
                      message = (bad.get("message") or "").strip().splitlines()
                      if message:
                          print("    " + message[0][:300])
          if not found:
              print("No failing test cases were recorded.")
          PYEOF
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the migration matches the schema Room expects
        run: python3 tools/check_migration.py app/schemas app/src/main/java/com/grocerypricer/app/data/db/Migrations.kt

      - name: Check the exported Room schema is committed
        if: always()
        run: |
          # exportSchema = true is only worth anything if the JSON it produces is in
          # the repository: a future version 2 migration is tested against the version 1
          # schema, and there is nothing to test against if it was never committed.
          shopt -s nullglob
          GENERATED=(app/schemas/*/*.json)
          if [ ${#GENERATED[@]} -eq 0 ]; then
            echo "No schema JSON was generated - the Room annotation processor did not run."
            exit 0
          fi
          MISSING=0
          for f in "${GENERATED[@]}"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              if ! git diff --quiet -- "$f"; then
                echo "::warning file=$f::The exported Room schema changed. Commit the new version."
                MISSING=1
              fi
            else
              echo "::warning file=$f::Room exported this schema but it is not committed. Run the build locally and commit it before writing a migration."
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "Exported Room schema matches what is committed."
          else
            {
              echo "### Room schema"
              echo ""
              echo "The exported schema under \`app/schemas/\` is missing from the repository or out of date."
              echo "It is attached to the **Grocery-Pricer-reports** artifact - commit it before writing a migration."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The privacy claim in the README is only worth something if it can be checked against
      # the APK that was actually built, dependencies and all.
      - name: Report and check merged manifest permissions
        run: |
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*debug*' | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "ERROR: no merged debug manifest was found to check" >&2
            exit 1
          fi

          {
            echo "### Permissions in the merged manifest"
            echo ""
            echo '```'
            grep -oE 'android:name="android\.permission\.[A-Z_]+"' "$MANIFEST" \
              | sed 's/android:name="//;s/"//' | sort -u
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # The app talks to the AI provider itself, so this is not optional and must not be
          # left to a dependency to supply. Without it every order would fail at the first
          # request, on the device, with no clue why.
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "ERROR: merged manifest is missing android.permission.INTERNET" >&2
            echo "Grocery Pricer calls the AI provider directly; declare it in app/src/main/AndroidManifest.xml." >&2
            exit 1
          fi
          echo "android.permission.INTERNET is present in the merged manifest."

      - name: Name the APK for humans
        run: |
          # Read the version out of the build file rather than repeating it here, so bumping
          # the app version never leaves CI publishing a stale filename.
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "APK_NAME=grocery-pricer-${VERSION}-debug.apk" >> "$GITHUB_ENV"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/grocery-pricer-${VERSION}-debug.apk"
          ls -lh artifacts/

      - name: Report APK size
        run: |
          SIZE=$(stat -c%s "artifacts/$APK_NAME")
          {
            echo "### Grocery Pricer debug APK"
            echo ""
            echo "- File: \`$APK_NAME\`"
            echo "- Size: $(numfmt --to=iec --suffix=B "$SIZE")"
            echo "- Download it from the **Grocery-Pricer-Android-debug** artifact below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Grocery-Pricer-Android-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Grocery-Pricer-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/schemas/
          if-no-files-found: ignore
          retention-days: 14
