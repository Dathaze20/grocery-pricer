name: Android

# Builds and tests Grocery Pricer and publishes an installable debug APK as a
# downloadable artifact on every run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: Run Android Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # Gradle buries compiler errors under a long stack trace. Repeat just the
      # errors at the end of the log so a failure is readable at a glance.
      - name: Summarise build errors
        if: failure()
        run: |
          echo "### Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            grep -E "^e: |^ERROR:|error: " "$RUNNER_TEMP/gradle.log" || true
            grep -E "^\* What went wrong:" -A 6 "$RUNNER_TEMP/gradle.log" || true
          } | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -200 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK for humans
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/grocery-pricer-1.0.0-debug.apk
          ls -lh artifacts/

      - name: Report APK size
        run: |
          SIZE=$(stat -c%s artifacts/grocery-pricer-1.0.0-debug.apk)
          {
            echo "### Grocery Pricer debug APK"
            echo ""
            echo "- File: \`grocery-pricer-1.0.0-debug.apk\`"
            echo "- Size: $(numfmt --to=iec --suffix=B "$SIZE")"
            echo "- Download it from the **Grocery-Pricer-Android-debug** artifact below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Grocery-Pricer-Android-debug
          path: artifacts/grocery-pricer-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Grocery-Pricer-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
